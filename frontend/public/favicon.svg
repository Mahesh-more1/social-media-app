<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cubeGradient-favicon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="shadowGradient-favicon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Shadow -->
  <ellipse cx="70" cy="105" rx="20" ry="5" fill="url(#shadowGradient-favicon)" />

  <!-- 3D Cube Faces -->
  <path d="M30 40 L70 20 L70 60 L30 80 Z" fill="url(#cubeGradient-favicon)" />
  <path d="M30 40 L70 20 L110 40 L70 60 Z" fill="url(#cubeGradient-favicon)" fill-opacity="0.8" />
  <path d="M70 20 L110 40 L110 80 L70 60 Z" fill="url(#cubeGradient-favicon)" fill-opacity="0.6" />

  <!-- Connection Nodes -->
  <circle cx="45" cy="55" r="4" fill="#ffffff" opacity="0.9" />
  <circle cx="65" cy="35" r="3" fill="#ffffff" opacity="0.8" />
  <circle cx="85" cy="55" r="3" fill="#ffffff" opacity="0.8" />

  <!-- Connection Lines -->
  <path d="M45 55 L65 35 M65 35 L85 55 M45 55 L85 55" stroke="#ffffff" stroke-width="1.5" opacity="0.5" />
</svg>
